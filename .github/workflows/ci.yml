name: CI
on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.22"
          cache: false
      - run: go test -race -cover ./...
      - run: go vet ./...
  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.22"
          cache: false
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          extension=""
          if [ "$GOOS" = windows ]; then extension=".exe"; fi
          mkdir -p dist
          go build -trimpath  -o "dist/trust-smoke-${GOOS}-${GOARCH}${extension}" ./cmd/trust-smoke
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trust-smoke-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
          if-no-files-found: error
  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Package Go client source
        run: |
          mkdir -p dist
          git archive --format=tar.gz --prefix=trust-go-client/ HEAD -- \
            LICENSE README.md go.mod ':(top,glob)*.go' ':(exclude,top,glob)*_test.go' \
            cmd/trust-smoke/main.go > dist/trust-go-client-${GITHUB_SHA}.tar.gz
          cd dist
          sha256sum trust-go-client-*.tar.gz > checksums.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: trust-go-client-source-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
